<title>Nukkad Café: made to order</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ea;--wall:#c9dcc3;--panel:#fff;--ink:#1c2b2a;--mute:#566866;--line:#c8d8c4;--chk:#2f7d4f;--tab:#f6f6f0;--chalk:#1d3326;--cink:#eef5ee;--shadow:#a9c7ba;--sky1:#d6ecd8;--sky2:#f1f9ea;--leaf1:#8fc08a;--leaf2:#6aa56c;--leaf3:#b5d9a6;--onacc:#fff;--wood1:#a06f46;--wood2:#6e4628;--curt1:#d94a3d;--curt2:#9c261f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e1a14;--wall:#1d3a2a;--panel:#162419;--ink:#eaf3ef;--mute:#9db5b0;--line:#2b4636;--shadow:#0b1a17;--sky1:#16301f;--sky2:#3b6b4a;--leaf1:#2c5a3c;--leaf2:#244a31;--leaf3:#3a704b;--chk:#5cc88a;--onacc:#06210f;--wood1:#5e3d24;--wood2:#35210f;--curt1:#8f2a24;--curt2:#5c1612;}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;margin:0;line-height:1.1}
html,body{height:100%;overflow:hidden}body{margin:0}
.brand{font-size:1.35rem;color:var(--chk)}
main{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px)}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,54%)}.panel{border-left:0!important;border-top:3px solid var(--line)}}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;background:var(--wall);overflow:hidden;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;max-width:none;aspect-ratio:auto;z-index:-1}
@keyframes sw{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
#cup{filter:drop-shadow(0 6px 5px rgba(0,0,0,.3))}
.drift{animation:sw 9s ease-in-out infinite alternate}
svg{display:block;height:84%;width:auto;max-width:100%;aspect-ratio:1/1;overflow:visible}
.chalk{position:absolute;top:12px;left:12px;right:64px;z-index:2;background:var(--chalk);color:var(--cink);border-radius:10px;padding:8px 14px;font-size:.92rem;display:flex;align-items:center}
.fs{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border-radius:10px;border:0;background:var(--chalk);color:var(--cink);font-size:1.2rem;cursor:pointer}
#view{display:flex;flex-direction:column;gap:14px}
.done{text-align:center;align-items:center;padding:24px 0}.done .ck{width:84px;height:84px;border-radius:50%;background:#2f9e63;color:#fff;font-size:2.8rem;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.done .tok{font:400 3rem "Alfa Slab One",Georgia,serif;color:var(--chk)}@keyframes pop{from{transform:scale(.4);opacity:0}}
.tool{opacity:0;transition:opacity .3s}.tool.on{opacity:1}
.work{animation:wk .35s infinite alternate}@keyframes wk{to{transform:translateY(2px)}}
.bub circle{opacity:0}.boil .bub circle{animation:bb 1s infinite}.boil .bub circle:nth-child(2){animation-delay:.3s}.boil .bub circle:nth-child(3){animation-delay:.6s}
@keyframes bb{0%{opacity:0;transform:translateY(8px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
.steam path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:0}.hot .steam path{animation:rise 3s infinite}.hot .steam path:nth-child(2){animation-delay:1s}.hot .steam path:nth-child(3){animation-delay:2s}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:.7}100%{transform:translateY(-30px);opacity:0}}
.panel{display:flex;flex-direction:column;gap:14px;overflow:auto;padding:18px 22px 28px;background:var(--bg);border-left:3px solid var(--line)}
h2{font-size:clamp(1.6rem,4.5vw,2.3rem)}h3{font-size:1.05rem;margin-top:4px}
.sub{color:var(--mute);margin:0;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:600 .95rem "Hanken Grotesk",sans-serif;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.opt small{display:block;font-weight:400;color:var(--mute)}.opt[aria-pressed="true"]{border-color:var(--chk);background:color-mix(in srgb,var(--chk) 10%,var(--panel))}
.opt:hover{border-color:var(--ink)}
.btn{font:700 1rem "Hanken Grotesk",sans-serif;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--chk);color:var(--onacc)}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.92rem}
.card ul{margin:6px 0 0;padding:0;list-style:none}.card li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.ticket{background:var(--chalk);color:var(--cink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ticket h2{color:#ffd9a8}.ticket .sub{color:#b9ccc4}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;opacity:.45;transition:opacity .3s,background .3s}
.steps li.now{opacity:1;background:rgba(255,255,255,.12)}.steps li.done{opacity:.8}.steps li i{width:20px;height:20px;border-radius:50%;border:2px dashed #7f9a90;flex:none;display:grid;place-items:center;font-style:normal;font-size:.75rem}
.steps li.done i{background:#7bd3a0;border:0;color:#10281c}.steps li.now i{border:2px solid #ffd9a8}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:#ffd9a8;transition:width .5s}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills span{padding:4px 10px;border-radius:99px;border:1.5px solid #5d7a70;font-size:.82rem;opacity:.6}.pills span.on{background:#7bd3a0;color:#10281c;border-color:#7bd3a0;opacity:1}
.note{font-size:.8rem;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.drift,.taxi{animation:none!important}*{animation-duration:.01s!important;transition:none!important}}

function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);$("#fx").appendChild(e);return e}
function anim(e,kf,o){if(RM){e.remove();return}e.animate(kf,{fill:"forwards",...o}).onfinish=()=>e.remove()}

function fall(n,fill,type,pot){for(let i=0;i<n;i++){const x=pot?82+Math.random()*50:108+Math.random()*64,y0=pot?4:62,y1=pot?44:Math.max(y0+10,surf()-8);
const e=type=="cube"?el("rect",{x,y:y0,width:13,height:13,rx:3,fill:"#fff",stroke:"#b9c8cc"}):type=="slice"?el("circle",{cx:x,cy:y0,r:9,fill,stroke:"#d9b92e","stroke-width":2}):el("circle",{cx:x,cy:y0,r:type=="blob"?9:2+Math.random()*2.5,fill});

const money=()=>{let p=dr.price+[-10,0,15][sel.size]+(sel.shots-1)*(sel.shots==3?22:25);if(sel.milk&&sel.milk!="Whole"&&sel.milk!="Skim")p+=20;p+=Object.values(sel.x).filter(Boolean).length*10+(sel.syrup?15:0);return p};
const chip=(k,v,l,on)=>`<button class="opt" aria-pressed="${on}" data-k="${k}" data-v="${v}">${l}</button>`;
function menu(){const g=c=>D.filter(a=>a[2]==c).map(a=>`<button class="opt" data-pick="${a[0]}">${a[1]}<small>${a[4]} ml · ₹${a[5]}</small></button>`).join("");
$("#view").innerHTML=`<h2>What can we make you?</h2><h3>Coffee</h3><div class="grid">${g("coffee")}</div><h3>Tea</h3><div class="grid">${g("tea")}</div><p class="note">Recipes are starting standards. Quantities, temperatures and times are calibrated with each cafe’s own staff.</p>`;mode="menu";dr=null;reset();$("#chalk").textContent="Choose a drink to see your cup."}
function custom(){const o=dr.o,al=[];if(sel.milk){["Whole","Skim"].includes(sel.milk)&&al.push("Dairy");sel.milk=="Soy"&&al.push("Soy");sel.milk=="Almond"&&al.push("Tree nuts");sel.milk=="Oat"&&al.push("Oats (confirm gluten with cafe)")}dr.al&&al.push(dr.al);
const f=SF[sel.size],sc=s=>s.replace(/[\d.]+/,n=>Math.round(n*f*10)/10),G=(t,h)=>`<h3>${t}</h3><div class="chips">${h}</div>`;

if(dr.x.includes("syrup"))h+=G("Syrup",chip("syrup","","None",!sel.syrup)+SYR.map(s=>chip("syrup",s,s,sel.syrup==s)).join(""));
const ex=dr.x.filter(x=>x!="syrup");if(ex.length)h+=G("Add-ons",ex.map(x=>`<button class="opt" aria-pressed="${!!sel.x[x]}" data-x="${x}">${XL[x]}</button>`).join(""));

<button class="btn" data-order="1">Place order · ₹${money()}</button>`;

if(dr.id=="bubble_tea"){for(let i=0;i<12;i++){const e=document.createElementNS(NS,"circle");e.setAttribute("cx",98+(i%6)*20+(Math.floor(i/6)*9));e.setAttribute("cy",254-Math.floor(i/6)*17);e.setAttribute("r",8);e.setAttribute("fill","#2a1a12");$("#pearl").appendChild(e)}}draw()}
function pulse(k,v){const d=1500;let t=null;
if(k=="drink"||k=="shots"){if(dr.cat=="coffee"){t="tMach";stream(dr.col[1],54,d)}else{t="tPot";tilt("#potG",-22,d);stream("#bcdde6",30,d);fall(8,dr.col[1],"dot")}}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
